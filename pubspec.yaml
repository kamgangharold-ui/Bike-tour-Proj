name: bike_tour_guide
description: A location-aware digital tour guide for cyclists in Barcelona.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Location & geofencing
  geolocator: ^13.0.2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # State & persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Networking & utilities
  http: ^1.2.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
