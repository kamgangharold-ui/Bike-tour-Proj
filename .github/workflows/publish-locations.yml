name: Publish locations (one-shot)
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated location slugs to publish (set is_active:true)'
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install script dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Publish locations
        working-directory: scripts
        run: node publish-locations.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SLUGS: ${{ github.event.inputs.slugs }}
